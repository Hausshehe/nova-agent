plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.hausshehe.nova'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hausshehe.nova'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }
}

dependencies {
    // LSPosed provides the implementation at runtime. Keep the API out of the APK.
    compileOnly 'de.robv.android.xposed:api:82'
}
