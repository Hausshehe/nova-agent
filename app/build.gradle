plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.hausshehe.nova'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hausshehe.nova'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
